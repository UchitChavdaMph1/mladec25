<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MLA-CODERS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
        }
        header, nav, main, section, article, aside, footer { padding: 16px; }
        header { background: rgba(26,35,126,0.95); color: #fff; border-radius: 0 0 24px 24px; }
        nav {
            background: rgba(227,230,243,0.95);
            border-radius: 0 0 16px 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(60,80,180,0.07);
        }
        nav a {
            margin: 0 14px;
            color: #1a237e;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.2s, text-shadow 0.2s;
            position: relative;
        }
        nav a:after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #3949ab;
            transition: width .3s;
            position: absolute;
            left: 0;
            bottom: -2px;
        }
        nav a:hover {
            color: #3949ab;
            text-shadow: 0 2px 8px #b0b7e6;
        }
        nav a:hover:after {
            width: 100%;
        }
        main {
            max-width: 900px;
            margin: 32px auto;
            background: rgba(255,255,255,0.93);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(60,80,180,0.13);
        }
        section { margin-bottom: 24px; }
        .contact-form {
            max-width: 400px;
            margin: 0 auto;
            background: #e3e6f3;
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 2px 12px rgba(60,80,180,0.08);
        }
        .contact-form label {
            display: block;
            margin-bottom: 6px;
            color: #3949ab;
            font-weight: 500;
        }
        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            width: 95%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            background: #f5f7fa;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .contact-form input[type="text"]:focus,
        .contact-form input[type="email"]:focus,
        .contact-form textarea:focus {
            border: 1.5px solid #3949ab;
            outline: none;
            box-shadow: 0 2px 8px rgba(60,80,180,0.09);
        }
        .contact-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .contact-form button {
            background: linear-gradient(90deg, #1a237e 60%, #3949ab 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.2s;
        }
        .contact-form button:hover {
            background: linear-gradient(90deg, #3949ab 60%, #1a237e 100%);
            transform: scale(1.03);
        }
        .contact-info {
            text-align: center;
            margin-top: 24px;
        }
        .contact-info img {
            width: 60px;
            border-radius: 50%;
            margin-bottom: 8px;
            border: 2px solid #3949ab;
            transform: rotate(-8deg);
        }
        footer {
            background: rgba(26,35,126,0.95);
            color: #fff;
            text-align: center;
            border-radius: 24px 24px 0 0;
            margin-top: 32px;
        }
        @media (max-width: 700px) {
            main { margin: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>MLA-CODERS</h1>
        <p>Your one-stop solution for web services</p>
    </header>
    <nav>
        <a href="home2.html">Home</a>
        <a href="services2.html">Services</a>
        <a href="products2.html">Products</a>
        <a href="contact2.html">Contact</a>
    </nav>
    <main>
        <section>
            <h2>Contact Us</h2>
            <form class="contact-form" autocomplete="off">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" placeholder="Type your message..." required></textarea>

                <button type="submit">Send Message</button>
            </form>
            <div class="contact-info">
                <img src="https://img.icons8.com/color/96/000000/contacts.png" alt="Contact">
                <p>Email: <a href="mailto:info@mla-coders.com">info@mla-coders.com</a></p>
                <p>Phone: +91-9876543210</p>
                <p>Address: 123, Web Street, Tech City</p>
            </div>
        </section>
    </main>
    <footer>
        &copy; 2026 MLA-CODERS. All rights reserved.
    </footer>
</body>
</html>
