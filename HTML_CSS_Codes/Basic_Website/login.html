<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ef 100%);
            color: #222;
        }

        header {
            background: #1a237e;
            color: #fff;
            padding: 30px 0 10px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(30,40,100,0.08);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: left;
            margin: 0 0 0 40px;
            color: #3949ab;
        }

        nav {
            text-align: right;
            margin: 0 40px 0 0;
        }

        nav a {
            color: #1a237e;
            text-decoration: none;
            font-weight: 500;
            margin: 0 12px;
            font-size: 1rem;
            transition: color 0.2s;
            position: relative;
        }
        nav a:after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #3949ab;
            transition: width .3s;
            position: absolute;
            left: 0;
            bottom: -2px;
        }
        nav a:hover {
            color: #3949ab;
        }
        nav a:hover:after {
            width: 100%;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            box-shadow: 0 4px 24px rgba(60,80,180,0.07);
            border-radius: 18px;
            max-width: 400px;
            margin: 60px auto 0 auto;
            padding: 40px 32px 32px 32px;
        }

        .login-container h1 {
            margin-bottom: 24px;
            color: #1a237e;
            letter-spacing: 1px;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        label {
            font-weight: 500;
            margin-bottom: 6px;
            color: #3949ab;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            background: #f5f7fa;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border: 1.5px solid #3949ab;
            outline: none;
            box-shadow: 0 2px 8px rgba(60,80,180,0.09);
        }

        #sub-btn, input[type="submit"] {
            background: linear-gradient(90deg, #1a237e 60%, #3949ab 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(60,80,180,0.09);
            transition: background 0.2s, transform 0.2s;
            width: 100%;
        }
        #sub-btn:hover, input[type="submit"]:hover {
            background: linear-gradient(90deg, #3949ab 60%, #1a237e 100%);
            transform: translateY(-2px) scale(1.03);
        }

        @media (max-width: 600px) {
            .login-container {
                max-width: 95vw;
                padding: 24px 8px 24px 8px;
            }
            .brand, nav {
                margin: 0 10px;
            }
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.98rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }

    </style>
</head>

<body>
    <header>
        <h1>Custom Website</h1>
    </header>
    <div class="brand">MLA-CODERS</div>
    <nav>
        <a href="website.html">Home</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="login.html">SignIn</a>
        <a href="register.html">SignUp</a>
    </nav>
    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm" novalidate>
            <div class="error-msg" id="errorMsg"></div>
            <label for="username">Enter Username</label>
            <input type="text" id="username" placeholder="Username" required>

            <label for="password">Enter Password</label>
            <input type="password" id="password" placeholder="Password" required minlength="6">

            <input type="submit" value="Login" id="sub-btn">
        </form>
    </div>
</body>

<script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        form.addEventListener('submit', function (e) {
            errorMsg.style.display = 'none';
            let errors = "";
            const username = form.username.value.trim();
            const password = form.password.value;

            
            if (!password) {
                errors = "Password is required.";
            } else if (password.length < 6) {
                errors = "Password must be at least 6 characters.";
            }

            if (!username) {
                errors = "Username is required.";
            }

            if (errors.length > 0) {
                e.preventDefault();
                errorMsg.innerText = errors;
                errorMsg.style.display = 'block';
            } else {
                alert("Login Successful!" + username);
            e.preventDefault();
            window.location.href = "website.html";
            }

            

            
        });
    </script>

</html>
