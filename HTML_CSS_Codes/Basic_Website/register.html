<body>
    <header>
        <h1>Custom Website</h1>
    </header>
    <div class="brand">MLA-CODERS</div>
    <nav>
        <a href="website.html">Home</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="login.html">SignIn</a>
        <a href="register.html">SignUp</a>
    </nav>
    <div class="register-container">
        <h1>Signup</h1>
        <form id="registerForm" novalidate>
            <div class="error-msg" id="errorMsg"></div>
            <label for="username">Enter Username</label>
            <input type="text" id="username" placeholder="Username" required>

            <label for="mobile">Enter Mobile Number</label>
            <input type="number" id="mobile" placeholder="Mobile Number" minlength="10" maxlength="10" required >

            <label for="dob">Enter Date of Birth</label>
            <input type="date" id="dob" required>

            <label for="gender">Select Gender</label>
            <select id="gender" required>
                <option value="">--Select Gender--</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="password">Enter Password</label>
            <input type="password" id="password" placeholder="Password" required minlength="6">

            <label for="confirmpassword">Confirm Password</label>
            <input type="password" id="confirmpassword" placeholder="Confirm Password" required minlength="6">

            <input type="submit" value="Register" id="sub-btn">
        </form>
    </div>
    <script src="script.js"></script>
